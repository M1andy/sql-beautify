name: Package VSIX

# 仅在推送 v* 标签时触发打包并发布到 Release；推送 main 分支不触发
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # node_modules/vkbeautify 是 git 跟踪的 vendored 引擎，checkout 后即就位。
      # 不要 npm install：会从 registry 拉官方 vkbeautify 覆盖本仓库的修改。
      - name: Run golden tests
        run: node test/run-tests.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-sql-beautify-vsix
          path: "*.vsix"
          if-no-files-found: error

      # 打 v* 标签时把 vsix 附到对应 Release（tag 名需与 package.json 版本一致，如 v0.3.24）
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
